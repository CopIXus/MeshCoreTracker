; MeshCoreTracker
; The T-Beam environments compile the shared tracker core for the first test radios.
; They do not yet drive the LoRa radio. See docs/PORTING.md before treating a new board as done.

[platformio]
default_envs = native
src_dir = src

[env:native]
platform = native
test_framework = googletest
build_flags = -std=c++17 -Itracker
test_build_src = yes
build_src_filter =
  -<*>
  +<../tracker/TrackerConfig.cpp>
  +<../tracker/TrackerMessage.cpp>
  +<../tracker/TrackerMotion.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:Tbeam_SX1262_meshcore_tracker_ble]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -Itracker
  -D TRACKER_BOARD_TBEAM_SX1262
build_src_filter =
  -<*>
  +<main.cpp>
  +<../tracker/TrackerConfig.cpp>
  +<../tracker/TrackerMessage.cpp>
  +<../tracker/TrackerMotion.cpp>

[env:Tbeam_SX1276_meshcore_tracker_ble]
extends = env:Tbeam_SX1262_meshcore_tracker_ble
build_flags =
  ${env:Tbeam_SX1262_meshcore_tracker_ble.build_flags}
  -U TRACKER_BOARD_TBEAM_SX1262
  -D TRACKER_BOARD_TBEAM_SX1276
